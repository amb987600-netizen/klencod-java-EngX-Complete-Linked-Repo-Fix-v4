// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
	    dependencies {
	        classpath 'com.android.tools.build:gradle:8.7.2'
	        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'
	        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // androidx.browser 1.9.0 (pulled in by the social-login plugin) needs compileSdk 36
    // and AGP 8.9.1+. This project uses compileSdk 35 / AGP 8.7.2 (Capacitor 7), so pin
    // the last release that is compatible with them.
    configurations.configureEach {
        resolutionStrategy.force 'androidx.browser:browser:1.8.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
